[workspace]
channels = ["conda-forge"]
name = "chx-profile-collection"
platforms = [{ platform = "linux-64", glibc = "2.17" }]
version = "2026.3.0"
requires-pixi = ">=0.82.1"

[activation.env]
REDIS_HOST = "xf11id1-chx-redis1.nsls2.bnl.gov"

[feature.profile.dependencies]
bluesky-base = "==1.15.0"
bluesky-queueserver = "*"
matplotlib-base = ">=3.10"
networkx = ">=3.4.2,<4"
nslsii = "==0.11.8"
numpy = ">=2"
ophyd = ">=1.11.2"
pyepics = "*"
python = ">=3.12,<3.13"
semver = ">=3.0.4,<4"
tiled-client = ">=0.2.20"
pandas = ">=2.3.2,<3"
suitcase-specfile = ">=0.2.5,<0.3"
channelarchiver = ">=1.0.0,<2"
databroker = "==2.0.0"
lmfit = ">=1.3.4,<2"
termcolor = ">=3.1.0,<4"
pyfai = ">=2025.3.0,<2026"
silx = ">=2.2.2,<3"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
epicscorelibs = ">=7.0.7.99.1.1,<8"
scikit-beam = ">=0.0.27,<0.0.28"
bluesky-tiled-plugins = ">=2.0.12"
ophyd-async = ">=0.20"
blop = "==1.0.0b1"
ca-certificates = ">=2026.10.19"
certifi = ">=2026.10.19"
pip = ">=26.2.2"


[feature.profile.pypi-dependencies]
eiger-io = { git = "https://github.com/nsls-ii/eiger-io", rev = "master" }
pvxslibs = ">=1.3.2, <2"
chxtools = "==3.0.3"
#blop = "==1.0.0b1"
#blop= { git = "https://github.com/bluesky/blop.git" }


[feature.qs.dependencies]
bluesky-queueserver = "*"
bluesky-httpserver = "*"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"


[feature.terminal.dependencies]
ipython = ">=9.5.0"
pyside6 = "*"
numpy = ">2"


[feature.terminal.tasks]
start = "unset SESSION_MANAGER PYTHONPATH && MPLBACKEND=qtagg ipython --profile-dir=."
pvs = "ipython --profile-dir=. -c 'get_pv_types(); exit()'"

[environments.terminal]
features = ["profile", "terminal"]
solve-group = "profile"

[environments.qs]
features = ["profile", "qs"]
solve-group = "profile"
